[package]
name = "mlir-mracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"

[workspace]
members = ["crates/worker"]
default-members = [".", "crates/worker"]
resolver = "3"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libafl = { version = "=0.16.1", default-features = false, features = ["std", "derive"] }
libafl_bolts = { version = "=0.16.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "mracle-fuzz"
path = "src/main.rs"

[[bin]]
name = "mracle-replay"
path = "src/bin/replay.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
